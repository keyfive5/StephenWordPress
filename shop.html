<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — All Takeout</title>
<meta name="description" content="Custom sticker and label products for restaurants: social media, QR code, promotional, branded, tamper-evident, appreciation and food ID labels.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232E639E'/%3E%3Cpath d='M8 6h5a5 5 0 0 1 5 5v5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z' fill='%23F8FAFC'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="shop">
<div id="app-header"></div>

<main id="primary" class="site-main">
	<div class="page-hero page-hero--tight">
		<div class="container">
			<span class="eyebrow">The shop</span>
			<h1>Choose your label</h1>
			<p class="lede">Seven product ranges built for restaurants. Pick one, choose a template, and design it live — every order is reviewed by a real designer before it prints.</p>
		</div>
	</div>

	<div class="container" style="padding-bottom: var(--sp-9);">
		<div class="cat-tiles" id="cat-tiles"></div>
	</div>

	<section class="brand-statement--band">
		<div class="container">
			<p class="brand-statement">Turn Packaging <span class="bs-mark">into</span> Repeat Business</p>
		</div>
	</section>
</main>

<div id="app-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
	var D = window.ATO_DATA;
	var A = window.ATO;

	// One hero tile per category — the category name sits directly under
	// the picture and the whole tile links to that category's product page.
	document.getElementById('cat-tiles').innerHTML = D.categories.map(function (cat) {
		var product = D.productByCategory(cat.slug);
		if (!product) return '';
		var art = cat.photo
			? '<img src="' + cat.photo + '" alt="' + A.esc(cat.name) + ' on real takeout packaging" loading="lazy">'
			: '<span class="cat-tile-fallback">' + D.icon(cat.icon, 48) + '</span>';
		var count = product.templates.filter(function (t) { return t.image; }).length;
		return '<a class="cat-tile reveal" href="product.html?p=' + product.slug + '">' +
			'<span class="cat-tile-art">' + art + '</span>' +
			'<span class="cat-tile-body">' +
			'<span class="cat-tile-name">' + A.esc(cat.name) + '</span>' +
			'<span class="cat-tile-desc">' + A.esc(cat.desc) + '</span>' +
			'<span class="cat-tile-meta">' + (count ? count + ' templates · ' : '') + 'from ' + A.money(product.tiers[0].price) + '</span>' +
			'</span></a>';
	}).join('');

	if (window.atoRevealScan) window.atoRevealScan();
})();
</script>
</body>
</html>
